name: Preview SimuLife

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-video

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npx remotion browser ensure

      - name: Render preview
        run: |
          mkdir -p renders
          npx remotion render src/index.ts MyComp renders/preview.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: simulife-preview
          path: my-video/renders/preview.mp4
